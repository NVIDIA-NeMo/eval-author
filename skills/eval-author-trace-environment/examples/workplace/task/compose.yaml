services:
  main:
    depends_on:
      workplace:
        condition: service_healthy
  workplace:
    build:
      context: ./workplace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
