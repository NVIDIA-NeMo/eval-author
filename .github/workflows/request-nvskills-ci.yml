# Template: https://github.com/NVIDIA/skills/blob/main/.github/workflows/request-nvskills-ci.yml
name: Request NVSkills CI

on:
  issue_comment:
    types: [created]
  push:

jobs:
  authorize:
    if: >
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/nvskills-ci')) ||
      (github.event_name == 'push' &&
        github.actor == (vars.NVSKILLS_SIGNATURE_PUSH_ACTOR || 'nv-skills-ci[bot]') &&
        startsWith(github.event.head_commit.message, vars.NVSKILLS_SIGNATURE_COMMIT_TITLE || 'Attach NVSkills validation signatures'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      # Authorize before entering the reusable workflow's cancelling concurrency group.
      - name: Validate requester permission
        id: permission
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'issue_comment' ]; then
            role_name="$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq '.role_name // ""')"
            case "$role_name" in
              admin|maintain) ;;
              *) echo 'Requester must have maintain or admin permission'; exit 1 ;;
            esac
          fi
          echo 'allowed=true' >> "$GITHUB_OUTPUT"

  request:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    uses: NVIDIA/skills/.github/workflows/team-request.yml@3687569c216eb7e15712231e2615dfa1b79084a5
    secrets:
      NVSKILLS_CI_DISPATCH_TOKEN: ${{ secrets.NVSKILLS_CI_DISPATCH_TOKEN }}
