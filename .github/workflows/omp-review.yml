name: omp review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled]
  # TRIAL ONLY, revert before merge: lets this PR run its own workflow file against the omp-review-test environment.
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  authorize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User' &&
      github.event.sender.type == 'User' &&
      ((github.event.action == 'labeled' && github.event.label.name == 'omp-review') ||
       (github.event.action != 'labeled' && !github.event.pull_request.draft))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - name: Require a maintainer trigger and an author with write access
        id: permission
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.event.sender.login }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          actor_role="$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .role_name)"
          author_permission="$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission)"
          if [[ "$actor_role" =~ ^(admin|maintain)$ && "$author_permission" =~ ^(admin|write)$ ]]; then
            echo 'allowed=true' >>"$GITHUB_OUTPUT"
          else
            echo "Skipping: needs a maintain/admin trigger (got $ACTOR: $actor_role) and a write/admin author (got $AUTHOR: $author_permission)."
          fi

  review:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    # Job-level, so only authorized reviews compete: a newer one replaces a running one for the same PR, while runs
    # that authorize skips cannot cancel it.
    concurrency:
      group: omp-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment: ${{ github.event_name == 'pull_request' && 'omp-review-test' || 'omp-review' }}
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Collect PR context
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 trusted/tools/omp_review_context.py --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --out "$RUNNER_TEMP/omp-review/context"
      # Everything the sandbox can write lives on this fixed-size filesystem, so it cannot fill the runner's disk.
      - name: Create sandbox scratch filesystem
        run: |
          fallocate -l 10G "$RUNNER_TEMP/omp-scratch.img"
          mkfs.ext4 -q -m 0 "$RUNNER_TEMP/omp-scratch.img"
          mkdir "$RUNNER_TEMP/omp-scratch"
          sudo mount -o loop,nosuid,nodev "$RUNNER_TEMP/omp-scratch.img" "$RUNNER_TEMP/omp-scratch"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/omp-scratch"
      - name: Install gVisor
        env:
          GVISOR_RELEASE: "20261116.0"
          GVISOR_SHA512: a34261504066142b6c1cc4d1813bb2d092761675416e350edc98c4cc66469b63b6f41acdeed09681b6c717c00e80e437f5f2f9c8d37705b8a9260632867c2b7d
        run: |
          curl -fsSLo "$RUNNER_TEMP/gvisor.tar.zstd" "https://storage.googleapis.com/gvisor/releases/release/$GVISOR_RELEASE/x86_64/gvisor.tar.zstd"
          echo "$GVISOR_SHA512  $RUNNER_TEMP/gvisor.tar.zstd" | sha512sum -c -
          sudo tar --zstd -xf "$RUNNER_TEMP/gvisor.tar.zstd" -C /usr/local/bin
          sudo /usr/local/bin/runsc install
          sudo systemctl reload docker
      - name: Run sandboxed review
        # OMP_REVIEW_MINUTES bounds run.sh; the step timeout leaves room for shutdown and the always() steps below.
        timeout-minutes: 65
        env:
          OMP_REVIEW_INFERENCE_HUB_API_KEY: ${{ secrets.OMP_REVIEW_INFERENCE_HUB_API_KEY }}
          OMP_REVIEW_MODEL: ${{ vars.OMP_REVIEW_MODEL }}
          OMP_REVIEW_CONTEXT_WINDOW: ${{ vars.OMP_REVIEW_CONTEXT_WINDOW }}
          OMP_REVIEW_MAX_TOKENS: ${{ vars.OMP_REVIEW_MAX_TOKENS }}
          OMP_REVIEW_PRICES: ${{ vars.OMP_REVIEW_PRICES }}
          OMP_REVIEW_BUDGET_USD: "15"
          OMP_REVIEW_MINUTES: "60"
          OMP_REVIEW_RUNTIME: runsc
          TMPDIR: ${{ runner.temp }}/omp-scratch
        run: bash trusted/tools/omp-review/run.sh --repo "$GITHUB_WORKSPACE/pr" --context "$RUNNER_TEMP/omp-review/context" --out "$RUNNER_TEMP/omp-scratch/out" --status "$RUNNER_TEMP/omp-review/status.json"
      # Runs even if run.sh was killed before its own cleanup: stop every sandbox container (the model proxy holds
      # the key), then pass on review.json only if it is a small regular file. upload-artifact follows symlinks.
      # status.json is written by run.sh on the host, outside the sandbox.
      - name: Stop the sandbox and stage review.json
        if: always()
        run: |
          docker ps -aq --filter label=omp-review | xargs -r docker rm -f >/dev/null
          mkdir -p "$RUNNER_TEMP/omp-review/upload"
          for file in "$RUNNER_TEMP/omp-scratch/out/review.json" "$RUNNER_TEMP/omp-review/status.json"; do
            if [ -f "$file" ] && [ ! -L "$file" ] && [ "$(stat -c %s "$file")" -le 1048576 ]; then
              cp "$file" "$RUNNER_TEMP/omp-review/upload/"
            fi
          done
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omp-review
          path: |
            ${{ runner.temp }}/omp-review/upload/review.json
            ${{ runner.temp }}/omp-review/upload/status.json
          retention-days: 1
          if-no-files-found: ignore

  # The post job removes the omp-review label, but it skips cancelled reviews; remove it here so a re-run only
  # needs the label added again.
  unlabel:
    needs: review
    if: always() && github.event.action == 'labeled' && needs.review.result == 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove the omp-review label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/omp-review" --silent || echo "The omp-review label was already removed."

  post:
    needs: review
    if: always() && needs.review.result != 'skipped' && needs.review.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: trusted
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        continue-on-error: true
        with:
          name: omp-review
          path: ${{ runner.temp }}/omp-review/out
      - name: Post review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 trusted/tools/omp_review_post.py --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --review "$RUNNER_TEMP/omp-review/out/review.json" --status "$RUNNER_TEMP/omp-review/out/status.json" --run-url "$RUN_URL"
