name: Live anti-cheat experiment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch:
    inputs:
      run_live:
        description: Run bounded model-backed Harbor experiments on main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Plan without inference or containers
        run: |
          python tools/run_anti_cheat_live.py --mode plan --output "$RUNNER_TEMP/anti-cheat-plan"
          cat "$RUNNER_TEMP/anti-cheat-plan/anti-cheat-live-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: anti-cheat-live-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/anti-cheat-plan/anti-cheat-live-summary.json
            ${{ runner.temp }}/anti-cheat-plan/anti-cheat-live-summary.md
          retention-days: 90
          if-no-files-found: error

  live:
    needs: plan
    continue-on-error: true
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.run_live))
    environment: semantic-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Prepare fallback before provisioning
        run: python tools/run_anti_cheat_live.py --mode plan --output "$RUNNER_TEMP/anti-cheat-fallback"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: false
      - name: Install locked experiment runtime
        run: uv sync --locked
      - name: Run controls and paired live-agent arms
        env:
          INFERENCE_HUB_API_KEY: ${{ secrets.INFERENCE_HUB_API_KEY }}
        run: |
          uv run --locked python tools/run_anti_cheat_live.py --mode live \
            --output "$RUNNER_TEMP/anti-cheat-live" \
            --private-output "$RUNNER_TEMP/anti-cheat-private" --repetitions 2
      - name: Stage only aggregate measurements
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/anti-cheat-publish"
          source="$RUNNER_TEMP/anti-cheat-fallback"
          if test -f "$RUNNER_TEMP/anti-cheat-live/anti-cheat-live-summary.json" && \
             test -f "$RUNNER_TEMP/anti-cheat-live/anti-cheat-live-summary.md"; then
            source="$RUNNER_TEMP/anti-cheat-live"
          fi
          cp "$source/anti-cheat-live-summary.json" "$RUNNER_TEMP/anti-cheat-publish/"
          cp "$source/anti-cheat-live-summary.md" "$RUNNER_TEMP/anti-cheat-publish/"
          cat "$RUNNER_TEMP/anti-cheat-publish/anti-cheat-live-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: anti-cheat-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/anti-cheat-publish/anti-cheat-live-summary.json
            ${{ runner.temp }}/anti-cheat-publish/anti-cheat-live-summary.md
          retention-days: 90
          if-no-files-found: error
