name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '5 7 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && 'daily' || 'change' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  skill-evaluator:
    # Publish advisory evidence only; tool or upload failures must not fail CI.
    continue-on-error: true
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: false
      - name: Install pinned evaluation tools
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/skill-evaluator-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/skill-evaluator-bin
        run: |
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$UV_TOOL_BIN_DIR:$PATH"
          uv tool install --python 3.12 'skillevaluator[security] @ git+https://github.com/NVIDIA/SkillEvaluator.git@7e189c6bdada8910dfa1684f25feedca87f2db85'
          uv tool install --python 3.12 'skillspector @ git+https://github.com/NVIDIA/SkillSpector.git@69dcdfb74487d361ba4c811d088cfdea2ff3a9dc'
          uv tool install --python 3.12 semgrep==1.177.0
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt --output "$RUNNER_TEMP/gitleaks-checksums.txt"
          cd "$RUNNER_TEMP"
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks-checksums.txt | sha256sum --check -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C "$UV_TOOL_BIN_DIR" gitleaks
      - name: Scan Eval Author and ethos skills
        if: ${{ !cancelled() }}
        run: python tools/collect_skill_evaluations.py --output "$RUNNER_TEMP/skill-evaluations"
      - name: Stage full native reports for private retention
        if: ${{ always() && github.event.repository.private == true }}
        run: python tools/stage_skill_reports.py --source "$RUNNER_TEMP/skill-evaluations" --output "$RUNNER_TEMP/skill-evaluations-reports"
      - name: Retain full native reports (repository access only)
        if: ${{ always() && github.event.repository.private == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-evaluation-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-evaluations-reports/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload metrics for future fixtures ingestion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-evaluations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-evaluations/skillevaluator-summary.json
          if-no-files-found: warn
          retention-days: 30
  test:
    # Defense in depth only: PRs can edit this workflow. This condition does not
    # enforce repository access; see CONTRIBUTING.md.
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install public dependencies
        run: uv sync --locked

      - name: Install OSV-Scanner
        env:
          OSV_SCANNER_SHA256: 777b4bb7ddd10bdcc8a1aa398d37d05e91e866e7586f9cff3fca2f72b8153033
          OSV_SCANNER_URL: https://github.com/google/osv-scanner/releases/download/v2.3.3/osv-scanner_linux_amd64
        run: |
          curl --fail --location --silent --show-error "$OSV_SCANNER_URL" --output "$RUNNER_TEMP/osv-scanner"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check copyright headers
        run: uv run --locked python tools/check_copyright_headers.py

      - name: Check third-party licenses
        run: uv run --locked python tools/generate_third_party_licenses.py --check

      - run: uv run --locked ruff check .
      - name: Type check
        run: uv run --locked ty check --python-version ${{ matrix.python-version }}
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q -rs
  gym-compatibility:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: audit
            artifact: gym
          - route: trace
            artifact: gym-trace
          - route: ng-trajectory
            artifact: gym-ng-trajectory
    env:
      GYM_REVISION: 3045a793346a31291d7ea4ae6af3f94a35036ce5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.3"
          python-version: "3.13"
          enable-cache: false
      - name: Install Eval Author test environment
        run: uv sync --locked
      - name: Install isolated Gym v0.6.0 runtime
        run: |
          git clone --no-checkout https://github.com/NVIDIA-NeMo/Gym.git "$RUNNER_TEMP/gym"
          git -C "$RUNNER_TEMP/gym" checkout --detach "$GYM_REVISION"
          uv sync --directory "$RUNNER_TEMP/gym" --locked --no-dev
      - name: Exercise native Gym task scaffolding and execution controls
        if: ${{ !cancelled() }}
        run: |
          python_bin=.venv/bin/python
          if ! test -x "$python_bin"; then python_bin=python3; fi
          "$python_bin" tools/collect_gym_evidence.py --output "$RUNNER_TEMP/gym-evidence" \
            --gym-python "$RUNNER_TEMP/gym/.venv/bin/python" --gym-root "$RUNNER_TEMP/gym" \
            --gym-revision "$GYM_REVISION" --route "${{ matrix.route }}"
      - name: Publish Gym measurement summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gym-evidence/gym-summary.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain native evidence and JUnit results
        if: ${{ !cancelled() && github.event.repository.private == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gym-evidence/
          # The synthetic trace workspaces live under pytest/**/.eval-author/.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
