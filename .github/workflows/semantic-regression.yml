name: Semantic regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '35 7 * * *'
  workflow_dispatch:
    inputs:
      run_live:
        description: Compare narrative reports against the configured baseline
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Plan the synthetic narrative pilot without inference
        run: |
          python tools/run_semantic_ci.py --output "$RUNNER_TEMP/semantic-plan"
          cat "$RUNNER_TEMP/semantic-plan/semantic-regression-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semantic-regression-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/semantic-plan/semantic-regression-summary.*
          retention-days: 30

  live:
    needs: plan
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.run_live))
    environment: semantic-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Prepare fallback report if provisioning fails
        run: python tools/run_semantic_ci.py --output "$RUNNER_TEMP/semantic-fallback"
      - name: Provision reviewed runtime and baseline bundle
        env:
          SEMANTIC_BUNDLE_URL: ${{ secrets.SEMANTIC_BUNDLE_URL }}
          SEMANTIC_BUNDLE_SHA256: ${{ vars.SEMANTIC_BUNDLE_SHA256 }}
          SEMANTIC_BUNDLE_PART_1: ${{ secrets.SEMANTIC_BUNDLE_PART_1 }}
          SEMANTIC_BUNDLE_PART_2: ${{ secrets.SEMANTIC_BUNDLE_PART_2 }}
          SEMANTIC_BUNDLE_PART_3: ${{ secrets.SEMANTIC_BUNDLE_PART_3 }}
          SEMANTIC_BUNDLE_PART_4: ${{ secrets.SEMANTIC_BUNDLE_PART_4 }}
        run: python tools/fetch_semantic_bundle.py --output "$RUNNER_TEMP/semantic-bundle"
      - name: Compare against locked baselines (never recalibrate in CI)
        env:
          INFERENCE_HUB_API_KEY: ${{ secrets.INFERENCE_HUB_API_KEY }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python tools/run_semantic_ci.py --mode check \
            --suite "$RUNNER_TEMP/semantic-bundle/suite.json" \
            --runtime "$RUNNER_TEMP/semantic-bundle/ratchet" --output "$RUNNER_TEMP/semantic-live"
      - name: Stage aggregate report even after failure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/semantic-publish"
          if test -f "$RUNNER_TEMP/semantic-live/semantic-regression-summary.json"; then
            cp "$RUNNER_TEMP/semantic-live/semantic-regression-summary."* "$RUNNER_TEMP/semantic-publish/"
          elif test -f "$RUNNER_TEMP/semantic-fallback/semantic-regression-summary.json"; then
            cp "$RUNNER_TEMP/semantic-fallback/semantic-regression-summary."* "$RUNNER_TEMP/semantic-publish/"
          fi
          if test -f "$RUNNER_TEMP/semantic-publish/semantic-regression-summary.md"; then
            cat "$RUNNER_TEMP/semantic-publish/semantic-regression-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semantic-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/semantic-publish/semantic-regression-summary.*
          retention-days: 30
          if-no-files-found: error
