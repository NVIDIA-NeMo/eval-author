[project]
name = "labs-eval-author"
version = "0.1.0"
description = "Skills that help coding assistants build agent evaluations, check existing suites, and audit behavior coverage with NeMo Gym or Harbor."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "third_party/licenses.jsonl", "third_party/NOTICES.txt", "third_party/license_texts/*.txt"]
requires-python = ">=3.12,<3.14"
dependencies = ["jsonschema>=4.23", "referencing>=0.28.4"]

[project.optional-dependencies]
# Workflow requirements are optional for skill users and included in license scans.
audit = ["harbor>=0.16.1", "pyyaml>=6.0", "pydantic>=2"]
mlflow = ["mlflow-skinny>=3.6,<4"]
trace-loaders = [
  "nemo-compass[mlflow]==0.1.0",
]

[dependency-groups]
dev = [
  "harbor==0.20.0",
  "mcp>=1.29,<2",
  "pre-commit>=4,<5",
  "pydantic>=2",
  "pytest>=9.0.3",
  "pyyaml>=6.0",
  "ruff>=0.14",
  "ty>=0.0.80",
  "nemo-compass[mlflow]==0.1.0",
]

[tool.uv]
# Nothing here installs as a package. The directory holds standalone skills, their
# bundled scripts, and contract tests. The skills stay at the top level
# so they can be copied into a customer's repository.
package = false
# databricks-sdk (via mlflow-skinny) caps protobuf <7, but no 6.x release fixes
# CVE-2026-0994 / BDSA-2025-123809 for Struct/Value/ListValue; 7.36.0 is the first that does.
# databricks-sdk only uses the Timestamp/Duration well-known types. Drop once its cap allows 7.x.
override-dependencies = ["protobuf>=7.36.0"]

[tool.pytest.ini_options]
testpaths = ["tests", "skills/eval-author-trace-environment/evals/tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W291", "W292", "W293", "I001", "I002"]

[tool.ty.environment]
# Scripts and tests add these standalone directories to sys.path at runtime.
extra-paths = [
  "tools",
  "skills/eval-author/scripts",
  "skills/eval-author-trace-environment/scripts",
  "skills/gym-to-atif/scripts",
]
