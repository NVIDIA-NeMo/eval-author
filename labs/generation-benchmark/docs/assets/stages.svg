<!-- Editable SVG: labels are text; no external fonts, scripts, or assets. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1730" viewBox="0 0 1280 1730" role="img" aria-labelledby="title description">
  <title id="title">Generation benchmark stages and the artifacts between them</title>
  <desc id="description">Stage 0 checks config schemas and the lock, then runs the metric setup command when one is declared. Stage 1 runs H(B) and measures M(B). Stage 2 measures M(Bᵢ). Stage 3 stages the workspace and runs G. Stage 4 runs the structural check, oracle, nop, and H(Gᵢ), records the outcomes, and measures M(Bᵢ⁺). Stage 5 computes ΔMᵢ and Rᵢ.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1e293b; }
      .title { font-size: 28px; font-weight: 700; letter-spacing: -.4px; }
      .subtitle { font-size: 16px; fill: #64748b; }
      .phase { font-size: 22px; font-weight: 700; }
      .number { font-size: 16px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .label { font-size: 16px; font-weight: 700; }
      .detail { font-size: 13px; fill: #475569; }
      .small { font-size: 13px; fill: #64748b; }
      .seam { font-size: 13px; font-weight: 700; fill: #64748b; }
      .eyebrow { font-size: 12px; font-weight: 700; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); }
      .band { stroke-width: 1.5; }
      .plate { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1280" height="1730" rx="20" fill="#fff"/>
  <text x="40" y="46" class="title">Generation benchmark</text>
  <text x="40" y="74" class="subtitle">How much of a subset's metric gap can a task generator close?</text>
  <text x="40" y="100" class="small">Cards sit on the boundary they cross. Color is the stage that wrote the artifact. White is supplied.</text>

  <rect x="32" y="122" width="1216" height="118" rx="16" class="plate"/>
  <text x="56" y="146" class="seam">BEFORE STAGE 0</text>
  <g stroke="#cbd5e1">
    <rect x="56" y="158" width="376" height="68" rx="12" fill="#fff"/>
    <rect x="452" y="158" width="376" height="68" rx="12" fill="#fff"/>
    <rect x="848" y="158" width="376" height="68" rx="12" fill="#fff"/>
  </g>
  <g class="eyebrow" fill="#64748b">
    <text x="72" y="178">supplied</text>
    <text x="468" y="178">supplied</text>
    <text x="864" y="178">before the run</text>
  </g>
  <text x="72" y="200" class="label">Case</text>
  <text x="72" y="218" class="detail">Agent A, task inventory B, subsets Bᵢ, ETHOS</text>
  <text x="468" y="200" class="label">generation-experiment.yml</text>
  <text x="468" y="218" class="detail">Execution, metric commands, and the generator command</text>
  <text x="864" y="200" class="label">Lock file</text>
  <text x="864" y="218" class="detail">Written by sign-generation before the run</text>

  <path d="M640 240 V256" class="flow"/>

  <rect x="32" y="256" width="1216" height="92" rx="16" class="band" fill="#f1f5f9" stroke="#cbd5e1"/>
  <circle cx="68" cy="302" r="16" fill="#475569"/>
  <text x="68" y="308" class="number">0</text>
  <text x="100" y="300" class="phase">Metric setup</text>
  <text x="100" y="328" class="detail">Check the config and the lock. Prepare D when setup is declared.</text>

  <path d="M640 348 V364" class="flow"/>

  <rect x="32" y="364" width="1216" height="118" rx="16" class="plate"/>
  <text x="56" y="388" class="seam">STAGE 0 WRITES · STAGE 1 READS</text>
  <rect x="56" y="400" width="1168" height="68" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="72" y="420" class="eyebrow" fill="#475569">stage 0</text>
  <text x="72" y="442" class="label">metric-setup/</text>
  <text x="72" y="460" class="detail">Fixed inputs D, when setup is declared</text>

  <path d="M640 482 V498" class="flow"/>

  <rect x="32" y="498" width="1216" height="92" rx="16" class="band" fill="#eff9f6" stroke="#cce9e0"/>
  <circle cx="68" cy="544" r="16" fill="#16856b"/>
  <text x="68" y="550" class="number">1</text>
  <text x="100" y="542" class="phase">Baseline</text>
  <text x="100" y="570" class="detail">Run H(B), then measure M(B).</text>

  <path d="M640 590 V606" class="flow"/>

  <rect x="32" y="606" width="1216" height="118" rx="16" class="plate"/>
  <text x="56" y="630" class="seam">STAGE 1 WRITES · STAGE 2 READS</text>
  <g>
    <rect x="56" y="642" width="576" height="68" rx="12" fill="#e7f6f1" stroke="#7dbeab"/>
    <rect x="648" y="642" width="576" height="68" rx="12" fill="#e7f6f1" stroke="#7dbeab"/>
  </g>
  <g class="eyebrow" fill="#16856b">
    <text x="72" y="662">stage 1</text>
    <text x="664" y="662">stage 1</text>
  </g>
  <text x="72" y="684" class="label">execution/</text>
  <text x="72" y="702" class="detail">H(B)</text>
  <text x="664" y="684" class="label">metric-full/</text>
  <text x="664" y="702" class="detail">M(B)</text>

  <path d="M640 724 V740" class="flow"/>

  <rect x="32" y="740" width="1216" height="92" rx="16" class="band" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="68" cy="786" r="16" fill="#1d4ed8"/>
  <text x="68" y="792" class="number">2</text>
  <text x="100" y="784" class="phase">Subset baseline</text>
  <text x="100" y="812" class="detail">Measure M(Bᵢ).</text>

  <path d="M640 832 V848" class="flow"/>

  <rect x="32" y="848" width="1216" height="118" rx="16" class="plate"/>
  <text x="56" y="872" class="seam">STAGE 2 WRITES · STAGE 3 READS</text>
  <g>
    <rect x="56" y="884" width="576" height="68" rx="12" fill="#e8f1ff" stroke="#93c5fd"/>
    <rect x="648" y="884" width="576" height="68" rx="12" fill="#fff" stroke="#cbd5e1"/>
  </g>
  <text x="72" y="904" class="eyebrow" fill="#1d4ed8">stage 2</text>
  <text x="664" y="904" class="eyebrow" fill="#64748b">supplied</text>
  <text x="72" y="926" class="label">metric-subsets/</text>
  <text x="72" y="944" class="detail">One directory per subset</text>
  <text x="664" y="926" class="label">Generator command</text>
  <text x="664" y="944" class="detail">Staged with the agent, ETHOS, Bᵢ, and the metric output</text>

  <path d="M640 966 V982" class="flow"/>

  <rect x="32" y="982" width="1216" height="92" rx="16" class="band" fill="#f5f3ff" stroke="#ddd6fe"/>
  <circle cx="68" cy="1028" r="16" fill="#7c3aed"/>
  <text x="68" y="1034" class="number">3</text>
  <text x="100" y="1026" class="phase">Generate</text>
  <text x="100" y="1054" class="detail">Stage the workspace and run G. The task directories are Gᵢ.</text>

  <path d="M640 1074 V1090" class="flow"/>

  <rect x="32" y="1090" width="1216" height="118" rx="16" class="plate"/>
  <text x="56" y="1114" class="seam">STAGE 3 WRITES · STAGE 4 READS</text>
  <rect x="56" y="1126" width="1168" height="68" rx="12" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="72" y="1146" class="eyebrow" fill="#7c3aed">stage 3</text>
  <text x="72" y="1168" class="label">generation/</text>
  <text x="72" y="1186" class="detail">Workspace, output, and receipt. The task directories are Gᵢ.</text>

  <path d="M640 1208 V1224" class="flow"/>

  <rect x="32" y="1224" width="1216" height="92" rx="16" class="band" fill="#fff7ed" stroke="#fed7aa"/>
  <circle cx="68" cy="1270" r="16" fill="#c2410c"/>
  <text x="68" y="1276" class="number">4</text>
  <text x="100" y="1268" class="phase">Run and measure</text>
  <text x="100" y="1296" class="detail">Run H(Gᵢ), record the checks, and measure M(Bᵢ⁺).</text>

  <path d="M640 1316 V1332" class="flow"/>

  <rect x="32" y="1332" width="1216" height="118" rx="16" class="plate"/>
  <text x="56" y="1356" class="seam">STAGE 4 WRITES · STAGE 5 READS</text>
  <g>
    <rect x="56" y="1368" width="576" height="68" rx="12" fill="#ffedd5" stroke="#fdba74"/>
    <rect x="648" y="1368" width="576" height="68" rx="12" fill="#ffedd5" stroke="#fdba74"/>
  </g>
  <g class="eyebrow" fill="#c2410c">
    <text x="72" y="1388">stage 4</text>
    <text x="664" y="1388">stage 4</text>
  </g>
  <text x="72" y="1410" class="label">execution-gen/</text>
  <text x="72" y="1428" class="detail">H(Gᵢ), oracle, nop, and the structural check</text>
  <text x="664" y="1410" class="label">metric-plus/</text>
  <text x="664" y="1428" class="detail">M(Bᵢ⁺)</text>

  <path d="M640 1450 V1466" class="flow"/>

  <rect x="32" y="1466" width="1216" height="92" rx="16" class="band" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="68" cy="1512" r="16" fill="#334155"/>
  <text x="68" y="1518" class="number">5</text>
  <text x="100" y="1510" class="phase">Analysis</text>
  <text x="100" y="1538" class="detail">ΔMᵢ = M(Bᵢ⁺) − M(Bᵢ). Rᵢ = ΔMᵢ / (M(B) − M(Bᵢ)).</text>

  <path d="M640 1558 V1574" class="flow"/>

  <rect x="32" y="1574" width="1216" height="118" rx="16" class="plate"/>
  <text x="56" y="1598" class="seam">STAGE 5 WRITES</text>
  <rect x="56" y="1610" width="1168" height="68" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="72" y="1630" class="eyebrow" fill="#334155">stage 5</text>
  <text x="72" y="1652" class="label">generation-analysis.json</text>
  <text x="72" y="1670" class="detail">Median of defined Rᵢ, and the status and quality counts.</text>
</svg>
