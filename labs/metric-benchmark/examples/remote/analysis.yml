case_settings:
  registry-hello:
    description: {path: description.json}
    subsets: {path: subsets.json}
  pinned-hello:
    description: {path: description.json}
    subsets: {path: subsets.json}
coverage:
  system_id: synthetic-task-presence
  system_revision: '1'
  command:
    - /usr/bin/env
    - python3
    - -c
    - "import json; from pathlib import Path; r=json.loads(Path('request.json').read_text()); Path('response.json').write_text(json.dumps({'value': float(bool(r['tasks']))}))"
