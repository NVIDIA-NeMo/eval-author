# Bundle paths are illustrative; no agent bundles are included.
baseline:
  agent_bundle_id: baseline
  revision: '1'
  registered:
    bundle_input: runtime
    config_path: agent.yaml
  inputs:
    runtime:
      path: agents/baseline
      kind: directory
mutants:
- agent_bundle_id: mutant
  revision: '1'
  registered:
    bundle_input: runtime
    config_path: agent.yaml
  inputs:
    runtime:
      path: agents/mutant
      kind: directory
