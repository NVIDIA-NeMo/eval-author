<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1740" viewBox="0 0 1440 1740" role="img" aria-labelledby="title desc">
<title id="title">Local execution: function calls and control flow</title>
<desc id="desc">main calls io.cli, which parses arguments and calls run(args). run calls load_benchmark and then execute_benchmark. The library validates all job configurations first, then loops over cases and agents. Only a new job calls run_harbor, which calls asyncio.run, Job.create and job.run. Completed jobs are verified and collected; incomplete jobs require explicit Harbor recovery. Each case is validated and indexed, then an experiment manifest is written.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#64748b"/></marker>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #1e293b; }
.title { font-size: 32px; font-weight: 700; }
.subtitle { font-size: 18px; fill: #64748b; }
.heading { font-size: 22px; font-weight: 700; }
.label { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.mono { font-family: 'DejaVu Sans Mono', Consolas, monospace; font-size: 18px; }
.detail { font-size: 18px; fill: #475569; }
.small { font-size: 16px; fill: #64748b; }
.flow { fill: none; stroke: #64748b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
</style>
</defs>
<rect width="1440" height="1740" rx="18" fill="#fff"/>

<text x="40" y="52" class="title">Running the tasks: function calls</text>
<text x="40" y="84" class="subtitle">Arrows show execution order. Nested boxes show the coordinator’s loops; lists show calls inside each step.</text>
<rect x="40" y="120" width="250" height="116" rx="12" fill="#f5f3ff" stroke="#d8cef0"/>
<rect x="330" y="120" width="300" height="116" rx="12" fill="#f5f3ff" stroke="#d8cef0"/>
<rect x="670" y="120" width="250" height="116" rx="12" fill="#f5f3ff" stroke="#d8cef0"/>
<rect x="960" y="120" width="440" height="116" rx="12" fill="#f5f3ff" stroke="#d8cef0"/>
<text x="58" y="147" class="label" style="fill:#7650a4">RUN_EVALS.PY</text>
<text x="58" y="180" class="mono">main()</text>
<text x="58" y="210" class="small">Build the argument parser</text>
<text x="348" y="147" class="label" style="fill:#7650a4">IO.PY</text>
<text x="348" y="180" class="mono">cli(parser, run)</text>
<text x="348" y="210" class="small">parse_args() → run(args)</text>
<text x="688" y="147" class="label" style="fill:#7650a4">RUN_EVALS.PY</text>
<text x="688" y="180" class="mono">run(args)</text>
<text x="688" y="210" class="small">Load, then execute</text>
<text x="978" y="147" class="label" style="fill:#7650a4">CONFIG.PY</text>
<text x="978" y="180" class="mono">load_benchmark(path)</text>
<text x="978" y="210" class="small">read_benchmark() → verify/load inputs</text>
<path d="M290 178 H330" class="flow"/>
<path d="M630 178 H670" class="flow"/>
<path d="M920 178 H960" class="flow"/>
<path d="M1180 236 V284" class="flow"/>
<text x="660" y="266" class="small">Returns loaded inputs; run(args) then calls execute_benchmark().</text>
<rect x="24" y="288" width="1392" height="1380" rx="18" fill="#f4f8ff" stroke="#c8daef"/>
<text x="48" y="323" class="label" style="fill:#3578b9">EXECUTION.PY  ·  LIBRARY ENTRY POINT</text>
<text x="48" y="358" class="mono">execute_benchmark(loaded, run_id, output, runner=run_harbor)</text>
<text x="48" y="388" class="detail">Check run ID and Harbor version. Prepare every job before starting execution.</text>
<rect x="48" y="414" width="330" height="176" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="66" y="445" class="heading">1  Identify inputs</text>
<text x="66" y="480" class="mono">benchmark_identity()</text>
<text x="66" y="512" class="mono">loaded.identity</text>
<text x="66" y="542" class="small">input_digest() for unpinned</text>
<text x="66" y="567" class="small">inputs; bind the full benchmark</text>
<rect x="414" y="414" width="582" height="176" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="432" y="445" class="heading">2  Prepare jobs for every case × agent</text>
<text x="432" y="480" class="mono">PinnedInput.resolve() once per task / case</text>
<text x="432" y="512" class="mono">case_root() → job_configuration()</text>
<text x="452" y="542" class="mono">↳ agent_config()</text>
<text x="452" y="568" class="mono">↳ JobConfig.model_validate()</text>
<rect x="1032" y="414" width="360" height="176" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="1050" y="445" class="heading">3  Record execution inputs</text>
<text x="1050" y="480" class="mono">read_json() if present</text>
<text x="1050" y="512" class="mono">write_json()</text>
<text x="1050" y="542" class="mono">execution-inputs.json</text>
<text x="1050" y="567" class="small">Changed identity → stop</text>
<path d="M378 500 H414" class="flow"/>
<path d="M996 500 H1032" class="flow"/>
<path d="M1212 590 V618" class="flow"/>
<rect x="48" y="622" width="1344" height="884" rx="16" fill="#edf8f4" stroke="#aed8c8"/>
<text x="68" y="655" class="label" style="fill:#22785e">FOR EACH CASE  ·  sequential, in configuration order</text>
<text x="68" y="682" class="detail">case_root() chooses this case’s output directory. Start an empty list of observations.</text>
<rect x="68" y="701" width="1304" height="628" rx="14" fill="#fff" stroke="#b9dccc"/>
<text x="88" y="733" class="label" style="fill:#22785e">FOR EACH AGENT  ·  baseline first, then every mutant</text>
<rect x="108" y="753" width="1224" height="78" rx="12" fill="#f7faf9" stroke="#d4e5dd"/>
<text x="128" y="783" class="mono">write_json(request) → write_json(native request) if absent → read_json(native request)</text>
<text x="128" y="812" class="small">Preserve exact task bindings; compute expected request digests before choosing the path below.</text>
<path d="M720 831 V846 H273 V864" class="flow"/>
<path d="M720 831 V864" class="flow"/>
<path d="M720 831 V846 H1167 V864" class="flow"/>
<rect x="108" y="868" width="330" height="234" rx="12" fill="#f0f6ff" stroke="#b9cfea"/>
<text x="126" y="899" class="label" style="fill:#3578b9">RECEIPT EXISTS</text>
<text x="126" y="934" class="mono">read_json(receipt)</text>
<text x="126" y="966" class="mono">file_manifest(job_dir)</text>
<text x="126" y="1000" class="detail">Compare receipt and evidence</text>
<text x="126" y="1030" class="small">Mismatch → stop</text>
<text x="126" y="1073" class="detail" style="fill:#3578b9">No Harbor execution</text>
<rect x="470" y="868" width="500" height="234" rx="12" fill="#e8f5ee" stroke="#93c9ac"/>
<text x="488" y="899" class="label" style="fill:#22785e">NO RECEIPT + NO JOB DIRECTORY</text>
<text x="488" y="932" class="mono">runner(config) → run_harbor(config)</text>
<text x="508" y="962" class="mono">↳ asyncio.run(run())</text>
<text x="528" y="992" class="mono">↳ await Job.create(config)</text>
<text x="528" y="1022" class="mono">↳ await job.run()</text>
<text x="488" y="1055" class="detail">Harbor runs all tasks for this one agent.</text>
<text x="488" y="1081" class="small">Configured task concurrency; one attempt, no retries.</text>
<rect x="1002" y="868" width="330" height="234" rx="12" fill="#fff7e9" stroke="#e6c78f"/>
<text x="1020" y="899" class="label" style="fill:#946813">JOB EXISTS, NO RECEIPT</text>
<text x="1020" y="934" class="detail">Do not invoke runner()</text>
<text x="1020" y="966" class="detail">Try collecting saved results</text>
<text x="1020" y="1000" class="small">Finished → collect and seal</text>
<text x="1020" y="1030" class="small">Incomplete → stop</text>
<text x="1020" y="1073" class="detail" style="fill:#946813">Resume explicitly in Harbor</text>
<path d="M273 1102 V1120 H720 V1138" class="flow"/>
<path d="M720 1102 V1138" class="flow"/>
<path d="M1167 1102 V1120 H720 V1138" class="flow"/>
<rect x="108" y="1142" width="1224" height="105" rx="12" fill="#f7faf9" stroke="#d4e5dd"/>
<text x="128" y="1173" class="mono">collect_job(case, agent_index, root, native_request, metric)</text>
<text x="128" y="1204" class="mono">read_json() → TrialResult.model_validate() → native_observation() → Execution.model_validate()</text>
<text x="128" y="1232" class="small">Require a finished, complete task matrix; attach agent_run_id(); return observations sorted by task.</text>
<path d="M720 1247 V1262" class="flow"/>
<text x="128" y="1286" class="detail">If no receipt: file_manifest() → write_json(receipt). Append observations; continue with the next agent.</text>
<text x="88" y="1313" class="small">All three branches pass through collect_job(); missing or incomplete evidence raises an error.</text>
<path d="M720 1329 V1350" class="flow"/>
<rect x="108" y="1354" width="1224" height="122" rx="12" fill="#e3f1eb" stroke="#acd1be"/>
<text x="128" y="1385" class="label" style="fill:#22785e">AFTER ALL AGENTS IN THIS CASE</text>
<text x="128" y="1416" class="mono">RawResults(...) → validate_results(...) → write_json(case / results.json)</text>
<text x="128" y="1446" class="small">Validator checks the matrix and native evidence. Record the case index path, then continue to the next case.</text>
<path d="M720 1506 V1530" class="flow"/>
<rect x="48" y="1534" width="1344" height="108" rx="12" fill="#e4edf9" stroke="#b9cfea"/>
<text x="68" y="1565" class="label" style="fill:#3578b9">AFTER ALL CASES</text>
<text x="68" y="1596" class="mono">ExecutionManifest(...) → write_json(output / execution.json) → return manifest</text>
<text x="68" y="1624" class="small">The experiment manifest maps case IDs to their results indexes.</text>
<text x="40" y="1705" class="small">Errors: case/agent I/O and validation failures gain context; io.cli() prints ValueError/OSError and exits with status 2.</text>
</svg>
