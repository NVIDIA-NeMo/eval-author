<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 556" role="img" aria-labelledby="title desc"><title id="title">Deterministic anti-cheat controls</title><desc id="desc">A sound verifier must accept valid work. Planted defects verify detection in both directions.</desc><rect width="1100" height="556" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" font-size="28" fill="#20292e" font-weight="bold" text-anchor="start">Controls test rejection and valid acceptance</text><text x="30" y="78" font-size="19" fill="#20292e" font-weight="normal" text-anchor="start">Scripted native Harbor trials | No model calls | Retained November 19 results</text><text x="30" y="140" font-size="20" fill="#20292e" font-weight="bold" text-anchor="start">Sound verifier</text><text x="30" y="166" font-size="18" fill="#20292e" font-weight="normal" text-anchor="start">Correct reference accepted</text><rect x="420" y="128" width="500" height="32" rx="4" fill="#82ad34"/><text x="950" y="153" font-size="23" fill="#20292e" font-weight="normal" text-anchor="start">1 / 1</text><text x="30" y="228" font-size="20" fill="#20292e" font-weight="bold" text-anchor="start">Sound verifier</text><text x="30" y="254" font-size="18" fill="#20292e" font-weight="normal" text-anchor="start">Non-reference controls rejected</text><rect x="420" y="216" width="500" height="32" rx="4" fill="#82ad34"/><text x="950" y="241" font-size="23" fill="#20292e" font-weight="normal" text-anchor="start">5 / 5</text><text x="30" y="316" font-size="20" fill="#20292e" font-weight="bold" text-anchor="start">Planted vulnerable verifier</text><text x="30" y="342" font-size="18" fill="#20292e" font-weight="normal" text-anchor="start">Eligible exploits rewarded</text><rect x="420" y="304" width="500" height="32" rx="4" fill="#cb8263"/><text x="950" y="329" font-size="23" fill="#20292e" font-weight="normal" text-anchor="start">4 / 4</text><text x="30" y="404" font-size="20" fill="#20292e" font-weight="bold" text-anchor="start">Always-fail verifier</text><text x="30" y="430" font-size="18" fill="#20292e" font-weight="normal" text-anchor="start">Correct reference rejected</text><rect x="420" y="392" width="500" height="32" rx="4" fill="#cb8263"/><text x="950" y="417" font-size="23" fill="#20292e" font-weight="normal" text-anchor="start">1 / 1</text><text x="30" y="498" font-size="19" fill="#20292e" font-weight="normal" text-anchor="start">Green: expected sound behavior. Orange: deliberately defective verifier behavior.</text><text x="30" y="532" font-size="18" fill="#20292e" font-weight="normal" text-anchor="start">Checks overlap within the 18-trial panel. Fractions are not an overall quality score.</text></g></svg>
