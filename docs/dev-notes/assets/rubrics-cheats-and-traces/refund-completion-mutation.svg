<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
<title id="title">Refund experiment: rewarding a completion claim instead of the work</title>
<desc id="desc">The same completion-only submission is rejected by the original verifier and accepted by the deliberately broken variant. Forbidden-credit resistance falls from the simulated base score of 3 to 0. The rubric and refund requirements stay fixed.</desc>
<rect width="1100" height="640" rx="12" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#20292e">
<text x="32" y="46" font-size="28" font-weight="bold">What happens when saying "done" earns credit?</text>
<text x="32" y="82" font-size="20">Same refund task. Same completion-only submission. Same rubric.</text>
<rect x="32" y="108" width="1036" height="68" rx="8" fill="#eef2f5"/>
<text x="54" y="136" font-size="19" font-weight="bold">The control claims completion but performs no required refund actions.</text>
<text x="54" y="161" font-size="18">We deliberately change what the verifier accepts, then reassess the task.</text>
<rect x="32" y="202" width="500" height="288" rx="10" fill="#f0f6e8" stroke="#82ad34"/>
<rect x="568" y="202" width="500" height="288" rx="10" fill="#fcf0ea" stroke="#cb8263"/>
<text x="54" y="240" font-size="23" font-weight="bold">Original verifier</text>
<text x="590" y="240" font-size="23" font-weight="bold">Deliberately broken verifier</text>
<text x="54" y="279" font-size="19">Checks the required refund actions</text>
<text x="54" y="307" font-size="19">and reconciled ledger.</text>
<text x="590" y="279" font-size="19">Accepts the completion claim</text>
<text x="590" y="307" font-size="19">without the required refund events.</text>
<text x="54" y="354" font-size="23" font-weight="bold" fill="#426516">No credit for the shortcut</text>
<text x="590" y="354" font-size="23" font-weight="bold" fill="#994820">Undeserved credit</text>
<text x="54" y="404" font-size="18">Forbidden-credit resistance</text>
<text x="590" y="404" font-size="18">Forbidden-credit resistance</text>
<text x="54" y="447" font-size="32" font-weight="bold">3 / 3</text>
<text x="166" y="447" font-size="18">Base simulation assessment</text>
<text x="590" y="447" font-size="32" font-weight="bold">0 / 3</text>
<text x="702" y="447" font-size="18">Executed control exposes defect</text>
<text x="32" y="532" font-size="20" font-weight="bold">What it showed</text>
<text x="32" y="563" font-size="19">The rubric identified a planted failure to require the intended work.</text>
<text x="32" y="594" font-size="17">The base's 3 relies on supplied simulated attack evidence, not this one rejection.</text>
<text x="32" y="620" font-size="17">This was a constructed defect, not an exploit independently discovered by a model.</text>
</g></svg>
