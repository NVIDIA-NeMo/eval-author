<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 635" role="img" aria-labelledby="title desc"><title id="title">Solution exposure and pass rates</title><desc id="desc">BIRD: baseline 68.8%, gain 7.1 points. Customer service: 67.1%, gain 10.0 points. USACO: 96.3%, gain 1.2 points.</desc><rect width="1100" height="635" fill="white" rx="12"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="45" font-size="28" font-weight="bold" fill="#20292e">Solution exposure raises pass rates, unevenly</text><text x="32" y="80" font-size="19" font-weight="normal" fill="#20292e">Baseline pass rate plus reported gain | 300 paired tasks; three trials per variant</text><rect x="32" y="105" width="18" height="18" fill="#91a5b8"/><text x="60" y="121" font-size="18" font-weight="normal" fill="#20292e">Without solution information</text><rect x="400" y="105" width="18" height="18" fill="#82ad34"/><text x="428" y="121" font-size="18" font-weight="normal" fill="#20292e">Gain with solution information</text><text x="32" y="190" font-size="22" font-weight="bold" fill="#20292e">BIRD</text><text x="32" y="217" font-size="18" font-weight="normal" fill="#20292e">Evidence sentence</text><rect x="260" y="171" width="570" height="32" fill="#eef2f5"/><rect x="260" y="171" width="392.15999999999997" height="32" fill="#91a5b8"/><rect x="652.16" y="171" width="40.47" height="32" fill="#82ad34"/><text x="860" y="194" font-size="22" font-weight="bold" fill="#20292e">+7.1 points</text><text x="260" y="232" font-size="18" font-weight="normal" fill="#20292e">Baseline: 68.8%</text><text x="32" y="300" font-size="22" font-weight="bold" fill="#20292e">Customer service</text><text x="32" y="327" font-size="18" font-weight="normal" fill="#20292e">Expected-action hints</text><rect x="260" y="281" width="570" height="32" fill="#eef2f5"/><rect x="260" y="281" width="382.46999999999997" height="32" fill="#91a5b8"/><rect x="642.47" y="281" width="57.0" height="32" fill="#82ad34"/><text x="860" y="304" font-size="22" font-weight="bold" fill="#20292e">+10.0 points</text><text x="260" y="342" font-size="18" font-weight="normal" fill="#20292e">Baseline: 67.1%</text><text x="32" y="410" font-size="22" font-weight="bold" fill="#20292e">USACO</text><text x="32" y="437" font-size="18" font-weight="normal" fill="#20292e">Algorithmic hint</text><rect x="260" y="391" width="570" height="32" fill="#eef2f5"/><rect x="260" y="391" width="548.91" height="32" fill="#91a5b8"/><rect x="808.91" y="391" width="6.84" height="32" fill="#82ad34"/><text x="860" y="414" font-size="22" font-weight="bold" fill="#20292e">+1.2 points</text><text x="260" y="452" font-size="18" font-weight="normal" fill="#20292e">Baseline: 96.3%</text><text x="260.0" y="480" font-size="16" font-weight="normal" fill="#20292e">0%</text><text x="402.5" y="480" font-size="16" font-weight="normal" fill="#20292e">25%</text><text x="545.0" y="480" font-size="16" font-weight="normal" fill="#20292e">50%</text><text x="687.5" y="480" font-size="16" font-weight="normal" fill="#20292e">75%</text><text x="830.0" y="480" font-size="16" font-weight="normal" fill="#20292e">100%</text><text x="32" y="535" font-size="22" font-weight="bold" fill="#20292e">Exposure helped most where there was room to improve.</text><text x="32" y="570" font-size="19" font-weight="normal" fill="#20292e">The reported average gain across datasets was 6.1 percentage points.</text><text x="32" y="608" font-size="17" font-weight="normal" fill="#20292e">Rounded report values; stacked lengths use baseline plus gain. No new experiment run.</text></g></svg>
