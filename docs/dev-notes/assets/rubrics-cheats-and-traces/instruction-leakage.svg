<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 505" role="img" aria-labelledby="title desc"><title id="title">Instruction leakage comparison</title><desc id="desc">Reported figures from the supplied instruction-leakage analysis, internal use only.</desc><rect width="1100" height="505" rx="12" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" font-size="28" fill="#20292e" font-weight="bold" text-anchor="start">A small average gap can hide several effects</text><text x="30" y="78" font-size="19" fill="#20292e" font-weight="normal" text-anchor="start">Instruction-leakage analysis | Reported rounded percentages | Internal review</text><text x="30" y="150" font-size="21" fill="#20292e" font-weight="bold" text-anchor="start">BIRD</text><rect x="240" y="125" width="620" height="32" rx="4" fill="#e7ecef"/><rect x="240" y="125" width="426.56" height="32" fill="#668499"/><rect x="666.56" y="125" width="44.02" height="32" fill="#82ad34"/><text x="885" y="149" font-size="20" fill="#20292e" font-weight="normal" text-anchor="start">68.8% + 7.1 pp</text><text x="30" y="250" font-size="21" fill="#20292e" font-weight="bold" text-anchor="start">Customer service</text><rect x="240" y="225" width="620" height="32" rx="4" fill="#e7ecef"/><rect x="240" y="225" width="416.02" height="32" fill="#668499"/><rect x="656.02" y="225" width="62.0" height="32" fill="#82ad34"/><text x="885" y="249" font-size="20" fill="#20292e" font-weight="normal" text-anchor="start">67.1% + 10.0 pp</text><text x="30" y="350" font-size="21" fill="#20292e" font-weight="bold" text-anchor="start">USACO</text><rect x="240" y="325" width="620" height="32" rx="4" fill="#e7ecef"/><rect x="240" y="325" width="597.06" height="32" fill="#668499"/><rect x="837.06" y="325" width="7.44" height="32" fill="#82ad34"/><text x="885" y="349" font-size="20" fill="#20292e" font-weight="normal" text-anchor="start">96.3% + 1.2 pp</text><text x="30" y="443" font-size="19" fill="#20292e" font-weight="normal" text-anchor="start">Blue: without leak. Green: gain with leak. Gray: still failing with leak.</text><text x="30" y="478" font-size="18" fill="#20292e" font-weight="normal" text-anchor="start">300 task pairs, three trials per variant. Raw trials were not independently reanalyzed.</text></g></svg>
