<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 745" role="img" aria-labelledby="title desc"><title id="title">Failures despite solution exposure</title><desc id="desc">Six failure categories with counts 51, 30, 20, 17, 38 and 6; total 162.</desc><rect width="1100" height="745" fill="white" rx="12"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="45" font-size="28" font-weight="bold" fill="#20292e">Why trials still failed with solution information</text><text x="32" y="80" font-size="19" font-weight="normal" fill="#20292e">162 failed exposed-variant trials | Retrospective categories from the analysis</text><text x="32" y="134" font-size="18" font-weight="bold" fill="#20292e">BIRD</text><text x="32" y="158" font-size="18" font-weight="normal" fill="#20292e">Output shape / reference disagreement</text><text x="32" y="180" font-size="16" font-weight="normal" fill="#53616a">Both variants fail</text><rect x="520" y="137" width="408" height="26" fill="#91a5b8"/><text x="944" y="158" font-size="22" font-weight="bold" fill="#20292e">51</text><text x="32" y="222" font-size="18" font-weight="bold" fill="#20292e">BIRD</text><text x="32" y="246" font-size="18" font-weight="normal" fill="#20292e">Misleading information or its handling</text><text x="32" y="268" font-size="16" font-weight="normal" fill="#53616a">Unexposed variant passed at least once</text><rect x="520" y="225" width="240" height="26" fill="#91a5b8"/><text x="776" y="246" font-size="22" font-weight="bold" fill="#20292e">30</text><text x="32" y="310" font-size="18" font-weight="bold" fill="#20292e">BIRD</text><text x="32" y="334" font-size="18" font-weight="normal" fill="#20292e">Intermittent misses</text><text x="32" y="356" font-size="16" font-weight="normal" fill="#53616a">Exposed variant sometimes solves the task</text><rect x="520" y="313" width="160" height="26" fill="#91a5b8"/><text x="696" y="334" font-size="22" font-weight="bold" fill="#20292e">20</text><text x="32" y="398" font-size="18" font-weight="bold" fill="#20292e">Customer service</text><text x="32" y="422" font-size="18" font-weight="normal" fill="#20292e">Conversation ended before the write</text><text x="32" y="444" font-size="16" font-weight="normal" fill="#53616a"></text><rect x="520" y="401" width="136" height="26" fill="#91a5b8"/><text x="672" y="422" font-size="22" font-weight="bold" fill="#20292e">17</text><text x="32" y="486" font-size="18" font-weight="bold" fill="#20292e">Customer service</text><text x="32" y="510" font-size="18" font-weight="normal" fill="#20292e">Writes differ from reference path / arguments</text><text x="32" y="532" font-size="16" font-weight="normal" fill="#53616a"></text><rect x="520" y="489" width="304" height="26" fill="#91a5b8"/><text x="840" y="510" font-size="22" font-weight="bold" fill="#20292e">38</text><text x="32" y="574" font-size="18" font-weight="bold" fill="#20292e">USACO</text><text x="32" y="598" font-size="18" font-weight="normal" fill="#20292e">Wrong answers on hidden tests</text><text x="32" y="620" font-size="16" font-weight="normal" fill="#53616a"></text><rect x="520" y="577" width="48" height="26" fill="#91a5b8"/><text x="584" y="598" font-size="22" font-weight="bold" fill="#20292e">6</text><text x="32" y="685" font-size="20" font-weight="bold" fill="#20292e">Hints do not remove execution failures or disagreements about the answer.</text><text x="32" y="718" font-size="17" font-weight="normal" fill="#20292e">Counts describe the report&#x27;s classifications, not independently established causes.</text></g></svg>
